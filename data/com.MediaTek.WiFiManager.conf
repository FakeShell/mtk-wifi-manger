<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="com.MediaTek.WiFiManager"/>
  </policy>

  <!-- Allow all users to call methods and receive signals -->
  <policy context="default">
    <allow send_destination="com.MediaTek.WiFiManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.MediaTek.WiFiManager"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="com.MediaTek.WiFiManager"
           send_interface="com.MediaTek.WiFiManager"
           send_member="SetState"/>
    <allow send_destination="com.MediaTek.WiFiManager"
           send_interface="com.MediaTek.WiFiManager"
           send_member="WpaRefreshP2P"/>
    <allow receive_sender="com.MediaTek.WiFiManager"
           receive_interface="com.MediaTek.WiFiManager"
           receive_member="StateChanged"/>
  </policy>

  <!-- Allow root full access -->
  <policy user="root">
    <allow send_destination="com.MediaTek.WiFiManager"/>
    <allow receive_sender="com.MediaTek.WiFiManager"/>
  </policy>
</busconfig>
